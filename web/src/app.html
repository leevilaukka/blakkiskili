<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- the browser bar matches the header -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <!-- link previews: crawlers don't run JS, so these are the same for every page -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bläkkiskili" />
    <meta property="og:locale" content="fi_FI" />
    <meta property="og:title" content="Bläkkiskili" />
    <meta property="og:description" content="Promillearvio, juomapäiväkirja ja ryhmät. Telegram-botti ja nettisivu." />
    <meta property="og:url" content="https://blakkiskili.party/" />
    <meta property="og:image" content="https://blakkiskili.party/kili-256.jpg" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="256" />
    <meta name="twitter:card" content="summary" />
    <meta name="description" content="Promillearvio, juomapäiväkirja ja ryhmät. Telegram-botti ja nettisivu." />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.jpg" />
    <!-- installable as an app (PWA); the service worker is src/service-worker -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body>
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
