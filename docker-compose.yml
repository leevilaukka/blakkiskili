# Production: `COMPOSE_PROFILES=backup,web` in .env enables the off-site backup and the website tunnel.
# See deploy/RUNBOOK.md.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  kili:
    <<: *hardening
    # Built by .github/workflows/image.yml. `docker compose pull` fetches it; `--build` builds locally.
    image: ghcr.io/leevilaukka/blakkiskili:latest
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/kili.sqlite
      BACKUP_DIR: /app/backups
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    tmpfs: [/tmp]
    # 256 m was enough for the bot alone; the website (event streams, charts) gets the rest.
    mem_limit: 384m
    # The website listens on WEB_PORT (8081) inside the compose network only: the tunnel reaches
    # it as http://kili:8081. Never publish that port, the tunnel is the only way in.
    # Only needed in webhook mode (put a TLS reverse proxy in front of it). Bind to localhost
    # only: Docker-published ports bypass ufw.
    # ports:
    #   - "127.0.0.1:8080:8080"

  backup:
    <<: *hardening
    image: restic/restic:0.19.1
    profiles: [backup]
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Separate file: the backup container never sees BOT_TOKEN or APP_SECRET, and the bot
    # never sees the backup credentials.
    env_file: backup.env
    environment:
      RESTIC_CACHE_DIR: /tmp/restic-cache
    volumes:
      - ./backups:/backups:ro
      - ./deploy/backup.sh:/backup.sh:ro
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700"]
    mem_limit: 512m

  # Cloudflare Tunnel: the website's only way in. It connects out to Cloudflare, so no port is open
  # on the server and ufw stays as it is. Credentials are in their own file, like the backup's.
  tunnel:
    <<: *hardening
    # Pinned to the version tested in production (2026-11-11). Update on purpose, then check the tunnel registers.
    image: cloudflare/cloudflared:2026.10.7
    profiles: [web]
    command: tunnel --no-autoupdate run
    env_file: tunnel.env
    depends_on: [kili]
    tmpfs: [/tmp]
    mem_limit: 128m
